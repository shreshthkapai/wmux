[package]
name = "wmux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wmux"
path = "src/main.rs"

[lib]
name = "wmux_client"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
wmux-config = { path = "../wmux-config" }
wmux-cli = { path = "../wmux-cli" }
wmux-platform = { path = "../wmux-platform" }
wmux-protocol = { path = "../wmux-protocol" }

[target.'cfg(windows)'.dependencies]
wmux-windows = { path = "../wmux-windows" }

[target.'cfg(unix)'.dependencies]
wmux-unix = { path = "../wmux-unix" }

[lints]
workspace = true
