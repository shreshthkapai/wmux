[package]
name = "wmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "wmux"
path = "src/main.rs"

[[bin]]
name = "wmux-server"
path = "src/server_main.rs"

[lib]
name = "wmux_client"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
wmux-config = { path = "../wmux-config" }
wmux-core = { path = "../wmux-core" }
wmux-cli = { path = "../wmux-cli" }
wmux-platform = { path = "../wmux-platform" }
wmux-protocol = { path = "../wmux-protocol" }
wmux-server = { path = "../wmux-server" }

[target.'cfg(windows)'.dependencies]
wmux-windows = { path = "../wmux-windows" }

[target.'cfg(unix)'.dependencies]
wmux-unix = { path = "../wmux-unix" }

[lints]
workspace = true
