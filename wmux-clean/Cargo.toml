[workspace]
members = [
    "crates/wmux-config",
    "crates/wmux-core",
    "crates/wmux-platform",
    "crates/wmux-protocol",
    "crates/wmux-windows",
    "crates/wmux-server",
    "crates/wmux-cli",
    "crates/wmux-client",
    "crates/wmux-bench",
    "crates/wmux-conformance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
crossterm = { version = "0.28", default-features = false, features = ["bracketed-paste", "events", "windows"] }
smallvec = "1.15"
tokio = { version = "1.40", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false }
vte = { version = "0.14.1", default-features = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
