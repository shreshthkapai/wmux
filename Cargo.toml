[workspace]
members = [
    "crates/wmux-config",
    "crates/wmux-core",
    "crates/wmux-platform",
    "crates/wmux-protocol",
    "crates/wmux-unix",
    "crates/wmux-windows",
    "crates/wmux-server",
    "crates/wmux-cli",
    "crates/wmux-client",
    "crates/wmux-bench",
    "crates/wmux-conformance",
    "crates/wmux-stress",
]
resolver = "2"

[workspace.package]
version = "1.0.14"
edition = "2021"
rust-version = "1.96"
license = "MIT"
authors = ["Shreshth Kapai"]
description = "A persistent cross-platform terminal multiplexer"
repository = "https://github.com/shreshthkapai/wmux"
homepage = "https://github.com/shreshthkapai/wmux"
publish = false

[workspace.dependencies]
close_fds = "0.3.2"
crossterm = { version = "0.28", default-features = false, features = ["bracketed-paste", "events", "windows"] }
libc = "0.2"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "socket", "term"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
tokio = { version = "1.40", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false }
vte = { version = "0.14.1", default-features = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
