name: wmux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  portable-semantics:
    name: Portable semantics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: wmux-clean
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Run portable semantic conformance
        run: cargo run -p wmux-conformance --release
      - name: Check shared server and client libraries
        run: cargo check -p wmux-core -p wmux-platform -p wmux-protocol -p wmux-config -p wmux-server -p wmux -p wmux-conformance --lib
      - name: Test portable crates and shared runtime libraries
        run: cargo test -p wmux-core -p wmux-platform -p wmux-protocol -p wmux-config -p wmux-server -p wmux -p wmux-conformance --lib

  windows-baseline:
    name: Windows baseline
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wmux-clean
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Run semantic conformance
        run: cargo run -p wmux-conformance --release
      - name: Enforce release performance gate
        run: cargo run -p wmux-bench --release -- --suite full --gate
