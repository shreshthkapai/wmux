name: wmux quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmux-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: .

jobs:
  quality:
    name: Quality and workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - name: Compile fuzz harnesses on stable
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Lint fuzz harnesses on stable
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  portable:
    name: Portable semantics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Run portable semantic conformance
        run: cargo run --locked -p wmux-conformance --release
      - name: Test portable crates and shared runtime libraries
        run: cargo test --locked -p wmux-core -p wmux-platform -p wmux-protocol -p wmux-config -p wmux-server -p wmux -p wmux-conformance --lib

  native:
    name: Native lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: wmux-windows
          - os: ubuntu-latest
            package: wmux-unix
          - os: macos-15
            package: wmux-unix
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Lint native adapter
        run: cargo clippy --locked -p ${{ matrix.package }} --all-targets -- -D warnings
      - name: Guard macOS PTY startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p wmux-unix --lib \
            process::tests::custom_command_cwd_and_environment_are_applied -- \
            --exact --nocapture --test-threads=1 &
          cargo_pid=$!

          for _ in {1..90}; do
            if ! kill -0 "$cargo_pid" 2>/dev/null; then
              wait "$cargo_pid"
              exit $?
            fi
            sleep 1
          done

          echo "macOS PTY startup exceeded 90 seconds"
          ps -axo pid,ppid,state,etime,command
          while read -r test_pid; do
            sample_file="/tmp/wmux-pty-${test_pid}.sample.txt"
            sample "$test_pid" 5 1 -file "$sample_file" || true
            test -f "$sample_file" && cat "$sample_file"
          done < <(pgrep -f 'target/debug/deps/wmux_unix-' || true)

          kill "$cargo_pid" 2>/dev/null || true
          wait "$cargo_pid" 2>/dev/null || true
          exit 1
      - name: Test native adapter and lifecycle
        run: cargo test --locked -p ${{ matrix.package }} --all-targets -- --test-threads=1
      - name: Check native binaries
        run: cargo check --locked -p wmux --bins

  stress:
    name: Stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Run deterministic CI stress profile
        run: cargo run --locked -p wmux-stress --release -- --profile ci

  fuzz-smoke:
    name: Sanitizer fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-22
      - name: Cache Cargo and fuzz builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fuzz/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null 2>&1 || cargo +nightly-2026-08-22 install cargo-fuzz --locked
      - name: Prepare artifact directories
        run: mkdir -p fuzz/artifacts/command_text fuzz/artifacts/protocol_frame fuzz/artifacts/terminal_bytes fuzz/artifacts/theme_json
      - name: Fuzz command parser
        run: cargo +nightly-2026-08-22 fuzz run command_text -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/command_text/
      - name: Fuzz protocol decoder
        run: cargo +nightly-2026-08-22 fuzz run protocol_frame -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/protocol_frame/
      - name: Fuzz terminal engine
        run: cargo +nightly-2026-08-22 fuzz run terminal_bytes -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/terminal_bytes/
      - name: Fuzz theme document decoder
        run: cargo +nightly-2026-08-22 fuzz run theme_json -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/theme_json/
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Release performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Enforce full release performance gate
        run: cargo run --locked -p wmux-bench --release -- --suite full --gate
