name: wmux supply chain

on:
  push:
    paths:
      - .github/workflows/supply-chain.yml
      - .github/workflows/release.yml
      - .github/workflows/release-assets.yml
      - deny.toml
      - dist-workspace.toml
      - CHANGELOG.md
      - LICENSE
      - README.md
      - rust-toolchain.toml
      - scripts/test-verify-release-archives.ps1
      - scripts/verify-release-archives.ps1
      - wmux-clean/Cargo.lock
      - wmux-clean/Cargo.toml
      - wmux-clean/crates/**/Cargo.toml
  pull_request:
    paths:
      - .github/workflows/supply-chain.yml
      - .github/workflows/release.yml
      - .github/workflows/release-assets.yml
      - deny.toml
      - dist-workspace.toml
      - CHANGELOG.md
      - LICENSE
      - README.md
      - rust-toolchain.toml
      - scripts/test-verify-release-archives.ps1
      - scripts/verify-release-archives.ps1
      - wmux-clean/Cargo.lock
      - wmux-clean/Cargo.toml
      - wmux-clean/crates/**/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmux-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: ./wmux-clean/Cargo.toml
          command: check
          arguments: --all-features

  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test release archive verifier
        shell: pwsh
        run: ./scripts/test-verify-release-archives.ps1
      - name: Install dist 0.32.0
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Check generated release workflow
        run: dist generate --check
      - name: Validate v1 release plan
        run: dist plan --tag=v1.0.0
