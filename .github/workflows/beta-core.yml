name: wmux beta core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmux-beta-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: wmux-clean

jobs:
  quality:
    name: Quality and workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wmux-clean/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('wmux-clean/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Compile fuzz harnesses on stable
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Lint fuzz harnesses on stable
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings

  portable:
    name: Portable semantics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wmux-clean/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('wmux-clean/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Run portable semantic conformance
        run: cargo run --locked -p wmux-conformance --release
      - name: Test portable crates and shared runtime libraries
        run: cargo test --locked -p wmux-core -p wmux-platform -p wmux-protocol -p wmux-config -p wmux-server -p wmux -p wmux-conformance --lib

  native:
    name: Native lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: wmux-windows
          - os: ubuntu-latest
            package: wmux-unix
          - os: macos-latest
            package: wmux-unix
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wmux-clean/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('wmux-clean/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Lint native adapter
        run: cargo clippy --locked -p ${{ matrix.package }} --all-targets -- -D warnings
      - name: Test native adapter and lifecycle
        run: cargo test --locked -p ${{ matrix.package }} --all-targets
      - name: Check native binaries
        run: cargo check --locked -p wmux -p wmux-server --bins

  stress:
    name: Stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wmux-clean/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('wmux-clean/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Run deterministic CI stress profile
        run: cargo run --locked -p wmux-stress --release -- --profile ci

  fuzz-smoke:
    name: Sanitizer fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-22
      - name: Cache Cargo and fuzz builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wmux-clean/fuzz/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('wmux-clean/fuzz/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-08-22 install cargo-fuzz --locked
      - name: Prepare artifact directories
        run: mkdir -p fuzz/artifacts/command_text fuzz/artifacts/protocol_frame fuzz/artifacts/terminal_bytes
      - name: Fuzz command parser
        run: cargo +nightly-2026-08-22 fuzz run command_text -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/command_text/
      - name: Fuzz protocol decoder
        run: cargo +nightly-2026-08-22 fuzz run protocol_frame -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/protocol_frame/
      - name: Fuzz terminal engine
        run: cargo +nightly-2026-08-22 fuzz run terminal_bytes -- -max_total_time=30 -artifact_prefix=fuzz/artifacts/terminal_bytes/
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: wmux-clean/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Windows release performance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wmux-clean/target/
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('wmux-clean/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - name: Enforce full release performance gate
        run: cargo run --locked -p wmux-bench --release -- --suite full --gate
