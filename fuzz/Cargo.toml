[package]
name = "wmux-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
wmux-config = { path = "../crates/wmux-config", version = "=1.0.12" }
wmux-core = { path = "../crates/wmux-core", version = "=1.0.12" }
wmux-protocol = { path = "../crates/wmux-protocol", version = "=1.0.12" }

[[bin]]
name = "protocol_frame"
path = "fuzz_targets/protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terminal_bytes"
path = "fuzz_targets/terminal_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_text"
path = "fuzz_targets/command_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "theme_json"
path = "fuzz_targets/theme_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
